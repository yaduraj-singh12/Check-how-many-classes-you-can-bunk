<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JNU SOET | Mid-Term Debar & Attendance Planner</title>
  <style>
    :root {
      --bg: #090e17;
      --card-bg: #151f32;
      --card-border: #26354d;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --green: #22c55e;
      --green-bg: rgba(34, 197, 94, 0.12);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.12);
      --yellow: #f59e0b;
      --yellow-bg: rgba(245, 158, 11, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.75rem;
      color: var(--primary);
      margin-bottom: 6px;
      font-weight: 800;
    }

    header p {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .selector-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    @media (max-width: 700px) {
      .selector-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 450px) {
      .selector-grid {
        grid-template-columns: 1fr;
      }
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    label {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
    }

    input, select {
      background: #0b1120;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 650px) {
      .grid-3 {
        grid-template-columns: 1fr;
      }
    }

    .subject-info-banner {
      background: #0b1120;
      border: 1px dashed var(--card-border);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .calc-btn {
      width: 100%;
      background: var(--primary);
      color: #090e17;
      border: none;
      font-weight: 700;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.2s, transform 0.1s;
    }

    .calc-btn:hover {
      background: var(--primary-hover);
      color: #fff;
    }

    .status-card {
      text-align: center;
      padding: 24px;
      border-radius: 12px;
      background: #0e1726;
      border: 1px solid var(--card-border);
      display: none;
    }

    .debar-banner {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .debar-eligible {
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid var(--green);
    }

    .debar-danger {
      background: var(--red-bg);
      color: var(--red);
      border: 1px solid var(--red);
    }

    .percentage-text {
      font-size: 3.2rem;
      font-weight: 800;
      margin: 6px 0;
    }

    .status-message {
      font-size: 1.05rem;
      line-height: 1.5;
      color: var(--text);
    }

    .details-box {
      margin-top: 16px;
      padding: 14px;
      background: #0b1120;
      border-radius: 8px;
      text-align: left;
      font-size: 0.92rem;
      border-left: 4px solid var(--primary);
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 20px 0 10px 0;
      color: var(--muted);
      font-size: 0.9rem;
      border-top: 1px solid var(--card-border);
      margin-top: 20px;
      line-height: 1.6;
    }

    footer span {
      color: var(--primary);
      font-weight: 600;
    }

    footer a {
      color: var(--primary);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover {
      text-decoration: underline;
      color: var(--primary-hover);
    }
  </style>
</head>
<body>

<div class="container">
  <div>
    <header>
      <h1>Mid-Term Attendance & Debar Portal</h1>
      <p>Jaipur National University — CSE (Mid-Term Cutoff: 13th October 2026)</p>
    </header>

    <div class="card">
      <div class="selector-grid">
        <div class="input-group">
          <label for="semSelect">Semester</label>
          <select id="semSelect" onchange="onSemesterChange()">
            <option value="sem5" selected>B.Tech V Sem</option>
            <option value="sem3">B.Tech III Sem</option>
            <option value="sem7">B.Tech VII Sem</option>
          </select>
        </div>

        <div class="input-group">
          <label for="secSelect">Section</label>
          <select id="secSelect" onchange="onSectionChange()"></select>
        </div>

        <div class="input-group">
          <label for="batchSelect">Batch Group</label>
          <select id="batchSelect" onchange="populateSubjects()"></select>
        </div>

        <div class="input-group">
          <label for="typeSelect">Course Type</label>
          <select id="typeSelect" onchange="populateSubjects()">
            <option value="ALL">All Components</option>
            <option value="Theory">Theory Only</option>
            <option value="Lab">Practical/Lab Only</option>
          </select>
        </div>
      </div>

      <div class="input-group">
        <label for="subjectSelect">Select Course Component</label>
        <select id="subjectSelect" onchange="updateSubjectMeta()"></select>
      </div>

      <div class="subject-info-banner" id="subjectMeta">
        Loading schedule information...
      </div>

      <div class="grid-3">
        <div class="input-group">
          <label for="attendedClasses">Classes Attended (Present)</label>
          <input type="number" id="attendedClasses" min="0" placeholder="e.g. 15" />
        </div>
        <div class="input-group">
          <label for="classesHeldTillNow">Total Classes Held Till Now</label>
          <input type="number" id="classesHeldTillNow" min="0" placeholder="e.g. 18" />
        </div>
        <div class="input-group">
          <label for="totalExpectedTillOct">Total Expected (Till Oct 13)</label>
          <input type="number" id="totalExpectedTillOct" min="0" placeholder="e.g. 36" />
        </div>
      </div>

      <button class="calc-btn" onclick="checkAttendance()">Evaluate Debar Status & Future Plan</button>
    </div>

    <div class="card status-card" id="resultCard">
      <div id="debarTag" class="debar-banner"></div>
      <div style="font-size: 0.85rem; color: var(--muted);" id="subResultTitle"></div>
      <div class="percentage-text" id="pctDisplay">0%</div>
      <div class="status-message" id="statusMessage"></div>
      <div class="details-box" id="detailsBox"></div>
    </div>
  </div>

  <footer>
    Designed & Created by <span>Yaduraj Singh</span><br />
    Have suggestions or feedback? Email: <a href="mailto:yadurajsingh726@gmail.com">yadurajsingh726@gmail.com</a>
  </footer>
</div>

  let activeFilteredList = [];

  function onSemesterChange() {
    const sem = document.getElementById('semSelect').value;
    const secSelect = document.getElementById('secSelect');
    secSelect.innerHTML = '';
    
    Object.keys(timetableHierarchy[sem].sections).forEach(sec => {
      const opt = document.createElement('option');
      opt.value = sec;
      opt.text = sec;
      secSelect.appendChild(opt);
    });
    
    onSectionChange();
  }

  function onSectionChange() {
    const sem = document.getElementById('semSelect').value;
    const sec = document.getElementById('secSelect').value;
    const batchSelect = document.getElementById('batchSelect');
    batchSelect.innerHTML = '';

    const batches = timetableHierarchy[sem].sections[sec].batches;
    Object.keys(batches).forEach(b => {
      const opt = document.createElement('option');
      opt.value = b;
      opt.text = `Batch ${b}`;
      batchSelect.appendChild(opt);
    });

    populateSubjects();
  }

  function populateSubjects() {
    const sem = document.getElementById('semSelect').value;
    const sec = document.getElementById('secSelect').value;
    const batch = document.getElementById('batchSelect').value;
    const filterType = document.getElementById('typeSelect').value;
    const subSelect = document.getElementById('subjectSelect');
    subSelect.innerHTML = '';

    const allSubs = timetableHierarchy[sem].sections[sec].batches[batch] || [];
    activeFilteredList = allSubs.filter(sub => {
      if (filterType === 'ALL') return true;
      return sub.type === filterType;
    });

    activeFilteredList.forEach((sub, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.text = `[${sub.type}] ${sub.name}`;
      subSelect.appendChild(opt);
    });

    updateSubjectMeta();
  }

  function updateSubjectMeta() {
    const idx = document.getElementById('subjectSelect').value;
    const sub = activeFilteredList[idx];

    if (!sub) {
      document.getElementById('subjectMeta').innerHTML = "No courses match the chosen filter.";
      document.getElementById('totalExpectedTillOct').value = '';
      return;
    }

    document.getElementById('totalExpectedTillOct').value = sub.defaultTotal;
    document.getElementById('subjectMeta').innerHTML = `
      <strong>Course Code:</strong> ${sub.code} &nbsp;|&nbsp;
      <strong>Faculty:</strong> ${sub.faculty} &nbsp;|&nbsp;
      <strong>Weekly Slot:</strong> ${sub.weekly} &nbsp;|&nbsp;
      <strong>Estimated Total (Till Oct 13):</strong> ~${sub.defaultTotal} Sessions
    `;
  }

  function checkAttendance() {
    const attended = parseInt(document.getElementById('attendedClasses').value);
    const heldTillNow = parseInt(document.getElementById('classesHeldTillNow').value);
    const expectedTotal = parseInt(document.getElementById('totalExpectedTillOct').value);

    const sem = document.getElementById('semSelect').value;
    const sec = document.getElementById('secSelect').value;
    const batch = document.getElementById('batchSelect').value;
    const idx = document.getElementById('subjectSelect').value;
    const sub = activeFilteredList[idx];

    const resultCard = document.getElementById('resultCard');
    const debarTag = document.getElementById('debarTag');
    const pctDisplay = document.getElementById('pctDisplay');
    const statusMsg = document.getElementById('statusMessage');
    const detailsBox = document.getElementById('detailsBox');
    const subResultTitle = document.getElementById('subResultTitle');

    if (!sub) {
      alert("Please select a valid subject/lab component.");
      return;
    }

    if (isNaN(attended) || isNaN(heldTillNow) || isNaN(expectedTotal)) {
      alert("Please fill in all three numerical fields (Attended, Held Till Now, Expected Total).");
      return;
    }

    if (heldTillNow <= 0 || expectedTotal <= 0) {
      alert("Classes held till now and expected total must be greater than 0.");
      return;
    }

    if (attended < 0 || attended > heldTillNow) {
      alert("Attended classes cannot be negative or exceed the number of classes held till now.");
      return;
    }

    if (heldTillNow > expectedTotal) {
      alert("Classes held till now cannot exceed the total expected classes till October 13.");
      return;
    }

    const currentPct = ((attended / heldTillNow) * 100).toFixed(1);
    const remainingClasses = expectedTotal - heldTillNow;
    const totalRequiredForMidterm = Math.ceil(0.75 * expectedTotal);
    const shortfallTillOct = totalRequiredForMidterm - attended;
    const maxPossibleAttendanceCount = attended + remainingClasses;
    const maxPossiblePct = ((maxPossibleAttendanceCount / expectedTotal) * 100).toFixed(1);

    subResultTitle.innerText = `${sub.name} (${sub.type}) [${sub.code}] — ${sec}, Batch ${batch}`;
    pctDisplay.innerText = `${currentPct}%`;
    resultCard.style.display = 'block';

    if (currentPct >= 75) {
      pctDisplay.style.color = "var(--green)";
      debarTag.className = "debar-banner debar-eligible";
      debarTag.innerText = "✓ CURRENTLY SAFE (≥ 75%)";

      const safeCurrentBunks = Math.floor((4 * attended - 3 * heldTillNow) / 3);
      const totalSafeBunksTillOct = Math.max(0, expectedTotal - totalRequiredForMidterm - (heldTillNow - attended));

      statusMsg.innerHTML = `You are currently clear of the debar mark in <strong>${sub.name}</strong>.`;
      detailsBox.innerHTML = `
        • <strong>Current Attendance:</strong> ${attended}/${heldTillNow} (${currentPct}%)<br/>
        • <strong>Immediate Safe Bunks:</strong> You can miss up to <strong>${safeCurrentBunks}</strong> consecutive upcoming class(es) right now and stay &ge;75%.<br/>
        • <strong>Mid-Term Target (Oct 13):</strong> Out of the remaining <strong>${remainingClasses}</strong> class(es), you must attend at least <strong>${Math.max(0, shortfallTillOct)}</strong> more class(es) to maintain 75% overall.<br/>
        • <strong>Total Bunks Remaining Till Oct 13:</strong> You have a total buffer of <strong>${totalSafeBunksTillOct}</strong> more bunk(s) allowed across the remaining term.<br/>
        • <strong>Maximum Achievable Attendance:</strong> If you attend all remaining sessions, you can reach up to <strong>${maxPossiblePct}%</strong>.
      `;
    } else {
      pctDisplay.style.color = "var(--red)";
      debarTag.className = "debar-banner debar-danger";
      debarTag.innerText = "⚠ CURRENTLY IN DEBAR ZONE (< 75%)";

      const immediateRecovery = Math.ceil(3 * heldTillNow - 4 * attended);
      let targetAssessment = "";

      if (shortfallTillOct > remainingClasses) {
        targetAssessment = `<span style="color: var(--red); font-weight: bold;">It is impossible to get 75% attendance. Even if you attend all remaining ${remainingClasses} classes with 100% presence, you can get a maximum of only ${maxPossiblePct}% attendance.</span>`;
      } else {
        targetAssessment = `You must attend at least <strong>${Math.max(0, shortfallTillOct)}</strong> out of the remaining <strong>${remainingClasses}</strong> class(es) to clear the 75% Mid-Term requirement (Max achievable: <strong>${maxPossiblePct}%</strong>).`;
      }

      statusMsg.innerHTML = `Your current standing in <strong>${sub.name}</strong> is below the mandatory 75% cutoff.`;
      detailsBox.innerHTML = `
        • <strong>Current Attendance:</strong> ${attended}/${heldTillNow} (${currentPct}%)<br/>
        • <strong>Immediate Recovery:</strong> You need <strong>${immediateRecovery}</strong> consecutive class(es) with 100% presence right now to return to 75%.<br/>
        • <strong>Mid-Term Target (Oct 13):</strong> ${targetAssessment}<br/>
        • <strong>Total Target Needed:</strong> At least <strong>${totalRequiredForMidterm}</strong> attendances out of <strong>${expectedTotal}</strong> scheduled sessions.
      `;
    }
  }

  // Initialize
  onSemesterChange();
</script>
