<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JNU SOET | Mid-Term Debar & Attendance Portal</title>
  <style>
    :root {
      --bg: #090e17;
      --card-bg: #151f32;
      --card-border: #26354d;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --green: #22c55e;
      --green-bg: rgba(34, 197, 94, 0.12);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--primary);
      margin-bottom: 6px;
      font-weight: 800;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .selector-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    @media (max-width: 700px) {
      .selector-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 450px) {
      .selector-grid {
        grid-template-columns: 1fr;
      }
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    label {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
    }

    input, select {
      background: #0b1120;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width: 550px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .subject-info-banner {
      background: #0b1120;
      border: 1px dashed var(--card-border);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .calc-btn {
      width: 100%;
      background: var(--primary);
      color: #090e17;
      border: none;
      font-weight: 700;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.2s, transform 0.1s;
    }

    .calc-btn:hover {
      background: var(--primary-hover);
      color: #fff;
    }

    .calc-btn:active {
      transform: scale(0.99);
    }

    .status-card {
      text-align: center;
      padding: 24px;
      border-radius: 12px;
      background: #0e1726;
      border: 1px solid var(--card-border);
      display: none;
    }

    .debar-banner {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .debar-eligible {
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid var(--green);
    }

    .debar-danger {
      background: var(--red-bg);
      color: var(--red);
      border: 1px solid var(--red);
    }

    .percentage-text {
      font-size: 3.4rem;
      font-weight: 800;
      margin: 6px 0;
    }

    .status-message {
      font-size: 1.05rem;
      line-height: 1.5;
      color: var(--text);
    }

    .details-box {
      margin-top: 16px;
      padding: 14px;
      background: #0b1120;
      border-radius: 8px;
      text-align: left;
      font-size: 0.92rem;
      border-left: 4px solid var(--primary);
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 20px 0 10px 0;
      color: var(--muted);
      font-size: 0.9rem;
      border-top: 1px solid var(--card-border);
      margin-top: 20px;
    }

    footer span {
      color: var(--primary);
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="container">
  <div>
    <header>
      <h1>Mid-Term Attendance & Debar Portal</h1>
      <p>Jaipur National University — School of Engineering & Technology</p>
    </header>

    <div class="card">
      <div class="selector-grid">
        <div class="input-group">
          <label for="semSelect">Semester</label>
          <select id="semSelect" onchange="onSemesterChange()">
            <option value="sem5" selected>B.Tech V Sem</option>
            <option value="sem3">B.Tech III Sem</option>
            <option value="sem7">B.Tech VII Sem</option>
          </select>
        </div>

        <div class="input-group">
          <label for="secSelect">Section</label>
          <select id="secSelect" onchange="onSectionChange()"></select>
        </div>

        <div class="input-group">
          <label for="batchSelect">Batch Group</label>
          <select id="batchSelect" onchange="populateSubjects()"></select>
        </div>

        <div class="input-group">
          <label for="typeSelect">Course Type</label>
          <select id="typeSelect" onchange="populateSubjects()">
            <option value="ALL">All Courses</option>
            <option value="Theory">Theory Only</option>
            <option value="Lab">Practical/Lab Only</option>
          </select>
        </div>
      </div>

      <div class="input-group">
        <label for="subjectSelect">Select Course Component</label>
        <select id="subjectSelect" onchange="updateSubjectMeta()"></select>
      </div>

      <div class="subject-info-banner" id="subjectMeta">
        Loading schedule information...
      </div>

      <div class="grid-2">
        <div class="input-group">
          <label for="attendedClasses">Sessions Attended (Present)</label>
          <input type="number" id="attendedClasses" min="0" placeholder="e.g. 18" />
        </div>
        <div class="input-group">
          <label for="totalClasses">Total Sessions Delivered</label>
          <input type="number" id="totalClasses" min="0" placeholder="e.g. 24" />
        </div>
      </div>

      <button class="calc-btn" onclick="checkAttendance()">Evaluate Mid-Term Eligibility</button>
    </div>

    <div class="card status-card" id="resultCard">
      <div id="debarTag" class="debar-banner"></div>
      <div style="font-size: 0.85rem; color: var(--muted);" id="subResultTitle"></div>
      <div class="percentage-text" id="pctDisplay">0%</div>
      <div class="status-message" id="statusMessage"></div>
      <div class="details-box" id="detailsBox"></div>
    </div>
  </div>

  <footer>
    Designed & Created by <span>Yaduraj Singh</span>
  </footer>
</div>

  let activeFilteredList = [];

  function onSemesterChange() {
    const sem = document.getElementById('semSelect').value;
    const secSelect = document.getElementById('secSelect');
    secSelect.innerHTML = '';
    
    Object.keys(timetableHierarchy[sem].sections).forEach(sec => {
      const opt = document.createElement('option');
      opt.value = sec;
      opt.text = sec;
      secSelect.appendChild(opt);
    });
    
    onSectionChange();
  }

  function onSectionChange() {
    const sem = document.getElementById('semSelect').value;
    const sec = document.getElementById('secSelect').value;
    const batchSelect = document.getElementById('batchSelect');
    batchSelect.innerHTML = '';

    const batches = timetableHierarchy[sem].sections[sec].batches;
    Object.keys(batches).forEach(b => {
      const opt = document.createElement('option');
      opt.value = b;
      opt.text = `Batch ${b}`;
      batchSelect.appendChild(opt);
    });

    populateSubjects();
  }

  function populateSubjects() {
    const sem = document.getElementById('semSelect').value;
    const sec = document.getElementById('secSelect').value;
    const batch = document.getElementById('batchSelect').value;
    const filterType = document.getElementById('typeSelect').value;
    const subSelect = document.getElementById('subjectSelect');
    subSelect.innerHTML = '';

    const allSubs = timetableHierarchy[sem].sections[sec].batches[batch] || [];
    activeFilteredList = allSubs.filter(sub => {
      if (filterType === 'ALL') return true;
      return sub.type === filterType;
    });

    activeFilteredList.forEach((sub, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.text = `[${sub.type}] ${sub.name}`;
      subSelect.appendChild(opt);
    });

    updateSubjectMeta();
  }

  function updateSubjectMeta() {
    const idx = document.getElementById('subjectSelect').value;
    const sub = activeFilteredList[idx];

    if (!sub) {
      document.getElementById('subjectMeta').innerHTML = "No courses match the chosen filter.";
      return;
    }

    document.getElementById('subjectMeta').innerHTML = `
      <strong>Course Code:</strong> ${sub.code} &nbsp;|&nbsp;
      <strong>Faculty:</strong> ${sub.faculty} &nbsp;|&nbsp;
      <strong>Component:</strong> ${sub.type} (${sub.weekly})
    `;
  }

  function checkAttendance() {
    const total = parseInt(document.getElementById('totalClasses').value);
    const attended = parseInt(document.getElementById('attendedClasses').value);
    const sem = document.getElementById('semSelect').value;
    const sec = document.getElementById('secSelect').value;
    const batch = document.getElementById('batchSelect').value;
    const idx = document.getElementById('subjectSelect').value;
    const sub = activeFilteredList[idx];

    const resultCard = document.getElementById('resultCard');
    const debarTag = document.getElementById('debarTag');
    const pctDisplay = document.getElementById('pctDisplay');
    const statusMsg = document.getElementById('statusMessage');
    const detailsBox = document.getElementById('detailsBox');
    const subResultTitle = document.getElementById('subResultTitle');

    if (!sub) {
      alert("Please select a valid subject/lab component.");
      return;
    }

    if (isNaN(total) || isNaN(attended) || total <= 0 || attended < 0 || attended > total) {
      alert("Please provide valid numbers. Attended count cannot be negative or greater than total delivered sessions.");
      return;
    }

    const pct = ((attended / total) * 100).toFixed(1);
    subResultTitle.innerText = `${sub.name} (${sub.type}) [${sub.code}] — ${sec}, Batch ${batch}`;
    pctDisplay.innerText = `${pct}%`;
    resultCard.style.display = 'block';

    if (pct >= 75) {
      pctDisplay.style.color = "var(--green)";
      debarTag.className = "debar-banner debar-eligible";
      debarTag.innerText = "✓ ELIGIBLE FOR MID-TERMS";

      const safeBunks = Math.floor((4 * attended - 3 * total) / 3);
      statusMsg.innerHTML = `You are clear of the Mid-Term debarment threshold in <strong>${sub.name}</strong>.`;
      detailsBox.innerHTML = `
        • <strong>Safe Skip Allowance:</strong> You can safely miss up to <strong>${safeBunks}</strong> consecutive session(s) while retaining your &ge;75% standing.<br/>
        • <strong>Current Safety Margin:</strong> You hold a surplus of <strong>${attended - Math.ceil(0.75 * total)}</strong> session(s) over the required minimum.
      `;
    } else {
      pctDisplay.style.color = "var(--red)";
      debarTag.className = "debar-banner debar-danger";
      debarTag.innerText = "⚠ DEBAR ALERT: INELIGIBLE FOR MID-TERMS";

      const requiredClasses = Math.ceil(3 * total - 4 * attended);
      statusMsg.innerHTML = `Your attendance in <strong>${sub.name}</strong> has dropped below the compulsory 75% mark.`;
      detailsBox.innerHTML = `
        • <strong>Mandatory Attendance Goal:</strong> You must maintain unbroken attendance across the next <strong>${requiredClasses}</strong> consecutive session(s) to regain exam clearance.<br/>
        • <strong>Current Deficit:</strong> You are currently behind by <strong>${Math.ceil(0.75 * total) - attended}</strong> session(s).
      `;
    }
  }

  // Initialize
  onSemesterChange();
