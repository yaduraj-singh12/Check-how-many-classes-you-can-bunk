<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JNU CSE | Mid-Term Attendance & Debar Portal</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #22c55e;
      --green-bg: rgba(34, 197, 94, 0.12);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 820px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.75rem;
      color: var(--primary);
      margin-bottom: 6px;
    }

    header p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .selector-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    @media (max-width: 600px) {
      .selector-grid {
        grid-template-columns: 1fr;
      }
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    label {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 500;
    }

    input, select {
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width: 600px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .subject-info-banner {
      background: #0f172a;
      border: 1px dashed var(--card-border);
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .calc-btn {
      width: 100%;
      background: var(--primary);
      color: #0f172a;
      border: none;
      font-weight: bold;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.2s;
    }

    .calc-btn:hover {
      background: var(--primary-hover);
      color: #fff;
    }

    .status-card {
      text-align: center;
      padding: 24px;
      border-radius: 12px;
      background: #111e38;
      border: 1px solid var(--card-border);
      display: none;
    }

    .debar-banner {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .debar-eligible {
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid var(--green);
    }

    .debar-danger {
      background: var(--red-bg);
      color: var(--red);
      border: 1px solid var(--red);
    }

    .percentage-text {
      font-size: 3.2rem;
      font-weight: 800;
      margin: 6px 0;
    }

    .status-message {
      font-size: 1.05rem;
      line-height: 1.5;
      color: var(--text);
    }

    .details-box {
      margin-top: 16px;
      padding: 14px;
      background: #0f172a;
      border-radius: 8px;
      text-align: left;
      font-size: 0.9rem;
      border-left: 4px solid var(--primary);
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Mid-Term Attendance & Debar Portal</h1>
    <p>Jaipur National University | SOET — Department of CSE</p>
  </header>

  <!-- Configuration Card -->
  <div class="card">
    <div class="selector-grid">
      <div class="input-group">
        <label for="semSelect">Semester</label>
        <select id="semSelect" onchange="onSemesterChange()">
          <option value="sem5" selected>B.Tech V Sem</option>
          <option value="sem3">B.Tech III Sem</option>
          <option value="sem7">B.Tech VII Sem</option>
        </select>
      </div>

      <div class="input-group">
        <label for="secSelect">Section</label>
        <select id="secSelect" onchange="onSectionChange()"></select>
      </div>

      <div class="input-group">
        <label for="batchSelect">Batch Group</label>
        <select id="batchSelect" onchange="populateSubjects()"></select>
      </div>
    </div>

    <div class="input-group">
      <label for="subjectSelect">Select Subject / Lab</label>
      <select id="subjectSelect" onchange="updateSubjectMeta()"></select>
    </div>

    <div class="subject-info-banner" id="subjectMeta">
      Loading course metadata...
    </div>

    <div class="grid-2">
      <div class="input-group">
        <label for="attendedClasses">Classes Attended (Present)</label>
        <input type="number" id="attendedClasses" min="0" placeholder="e.g. 18" />
      </div>
      <div class="input-group">
        <label for="totalClasses">Total Classes Conducted Till Cutoff</label>
        <input type="number" id="totalClasses" min="0" placeholder="e.g. 24" />
      </div>
    </div>

    <button class="calc-btn" onclick="checkAttendance()">Evaluate Mid-Term Debar Status</button>
  </div>

  <!-- Output Status Card -->
  <div class="card status-card" id="resultCard">
    <div id="debarTag" class="debar-banner"></div>
    <div style="font-size: 0.85rem; color: var(--muted);" id="subResultTitle"></div>
    <div class="percentage-text" id="pctDisplay">0%</div>
    <div class="status-message" id="statusMessage"></div>
    <div class="details-box" id="detailsBox"></div>
  </div>
</div>

  function onSemesterChange() {
    const sem = document.getElementById('semSelect').value;
    const secSelect = document.getElementById('secSelect');
    secSelect.innerHTML = '';
    
    Object.keys(timetableHierarchy[sem].sections).forEach(sec => {
      const opt = document.createElement('option');
      opt.value = sec;
      opt.text = sec;
      secSelect.appendChild(opt);
    });
    
    onSectionChange();
  }

  function onSectionChange() {
    const sem = document.getElementById('semSelect').value;
    const sec = document.getElementById('secSelect').value;
    const batchSelect = document.getElementById('batchSelect');
    batchSelect.innerHTML = '';

    const batches = timetableHierarchy[sem].sections[sec].batches;
    Object.keys(batches).forEach(b => {
      const opt = document.createElement('option');
      opt.value = b;
      opt.text = `Batch ${b}`;
      batchSelect.appendChild(opt);
    });

    populateSubjects();
  }

  function populateSubjects() {
    const sem = document.getElementById('semSelect').value;
    const sec = document.getElementById('secSelect').value;
    const batch = document.getElementById('batchSelect').value;
    const subSelect = document.getElementById('subjectSelect');
    subSelect.innerHTML = '';

    const subjects = timetableHierarchy[sem].sections[sec].batches[batch] || [];
    subjects.forEach((sub, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.text = `${sub.name} (${sub.type})`;
      subSelect.appendChild(opt);
    });

    updateSubjectMeta();
  }

  function updateSubjectMeta() {
    const sem = document.getElementById('semSelect').value;
    const sec = document.getElementById('secSelect').value;
    const batch = document.getElementById('batchSelect').value;
    const idx = document.getElementById('subjectSelect').value;
    const sub = timetableHierarchy[sem].sections[sec].batches[batch][idx];

    if (!sub) return;
    document.getElementById('subjectMeta').innerHTML = `
      <strong>Course Code:</strong> ${sub.code} &nbsp;|&nbsp;
      <strong>Faculty:</strong> ${sub.faculty} &nbsp;|&nbsp;
      <strong>Timetable Slot:</strong> ${sub.weekly}
    `;
  }

  function checkAttendance() {
    const total = parseInt(document.getElementById('totalClasses').value);
    const attended = parseInt(document.getElementById('attendedClasses').value);
    const sem = document.getElementById('semSelect').value;
    const sec = document.getElementById('secSelect').value;
    const batch = document.getElementById('batchSelect').value;
    const idx = document.getElementById('subjectSelect').value;
    const sub = timetableHierarchy[sem].sections[sec].batches[batch][idx];

    const resultCard = document.getElementById('resultCard');
    const debarTag = document.getElementById('debarTag');
    const pctDisplay = document.getElementById('pctDisplay');
    const statusMsg = document.getElementById('statusMessage');
    const detailsBox = document.getElementById('detailsBox');
    const subResultTitle = document.getElementById('subResultTitle');

    if (isNaN(total) || isNaN(attended) || total <= 0 || attended < 0 || attended > total) {
      alert("Please enter valid class counts (Attended classes cannot exceed total classes conducted).");
      return;
    }

    const pct = ((attended / total) * 100).toFixed(1);
    subResultTitle.innerText = `${sub.name} [${sub.code}] — ${sec} (${batch})`;
    pctDisplay.innerText = `${pct}%`;
    resultCard.style.display = 'block';

    if (pct >= 75) {
      pctDisplay.style.color = "var(--green)";
      debarTag.className = "debar-banner debar-eligible";
      debarTag.innerText = "✓ ELIGIBLE FOR MID-TERM EXAM";

      const safeBunks = Math.floor((4 * attended - 3 * total) / 3);
      statusMsg.innerHTML = `You are safe from the Mid-Term debar list in <strong>${sub.name}</strong>.`;
      detailsBox.innerHTML = `
        • <strong>Safe Bunk Allowance:</strong> You can safely skip <strong>${safeBunks}</strong> consecutive class(es) without falling below the 75% cutoff.<br/>
        • <strong>Attendance Margin:</strong> You are currently <strong>${attended - Math.ceil(0.75 * total)}</strong> class(es) ahead of the minimum requirement.
      `;
    } else {
      pctDisplay.style.color = "var(--red)";
      debarTag.className = "debar-banner debar-danger";
      debarTag.innerText = "⚠ DEBARRED FROM MID-TERMS (BELOW 75%)";

      const requiredClasses = Math.ceil(3 * total - 4 * attended);
      statusMsg.innerHTML = `Your attendance in <strong>${sub.name}</strong> is under the mandatory 75% threshold.`;
      detailsBox.innerHTML = `
        • <strong>Required Consecutive Classes:</strong> You must attend the next <strong>${requiredClasses}</strong> consecutive lecture(s)/lab(s) with 100% presence to lift the debar status.<br/>
        • <strong>Current Shortfall:</strong> You are <strong>${Math.ceil(0.75 * total) - attended}</strong> attended class(es) behind the 75% requirement.
      `;
    }
  }

  // Initial Load
  onSemesterChange();
